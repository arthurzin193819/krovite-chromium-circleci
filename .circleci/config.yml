version: 2.1

jobs:
  fetch_source:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - run:
          name: fetch_source (Chromium Android real)
          command: bash scripts/01_fetch.sh
          no_output_timeout: 45m
      - save_cache:
          key: krovite-chromium-v2-{{ .Revision }}-source
          paths:
            - ~/chromium
  configure_source:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - krovite-chromium-v2-{{ .Revision }}-source
      - run:
          name: configure_source (Chromium Android real)
          command: bash scripts/02_prepare.sh
          no_output_timeout: 45m
      - save_cache:
          key: krovite-chromium-v2-{{ .Revision }}-prepared
          paths:
            - ~/chromium
  compile:
    parameters:
      previous:
        type: string
      next:
        type: string
    machine:
      image: ubuntu-2404:current
    resource_class: large
    steps:
      - checkout
      - restore_cache:
          keys:
            - krovite-chromium-v2-{{ .Revision }}-<< parameters.previous >>
      - run:
          name: Compile Chromium ARM64 (real)
          command: bash scripts/03_build.sh
          no_output_timeout: 45m
      - save_cache:
          key: krovite-chromium-v2-{{ .Revision }}-<< parameters.next >>
          paths:
            - ~/chromium
      - store_artifacts:
          path: output
          destination: chromium-android

workflows:
  android_chromium:
    jobs:
      - fetch_source:
          filters:
            branches:
              only: main
      - configure_source:
          requires:
            - fetch_source
      - compile:
          name: compile_01
          previous: prepared
          next: step01
          requires:
            - configure_source
      - compile:
          name: compile_02
          previous: step01
          next: step02
          requires:
            - compile_01
      - compile:
          name: compile_03
          previous: step02
          next: step03
          requires:
            - compile_02
      - compile:
          name: compile_04
          previous: step03
          next: step04
          requires:
            - compile_03
      - compile:
          name: compile_05
          previous: step04
          next: step05
          requires:
            - compile_04
      - compile:
          name: compile_06
          previous: step05
          next: step06
          requires:
            - compile_05
      - compile:
          name: compile_07
          previous: step06
          next: step07
          requires:
            - compile_06
      - compile:
          name: compile_08
          previous: step07
          next: step08
          requires:
            - compile_07
      - compile:
          name: compile_09
          previous: step08
          next: step09
          requires:
            - compile_08
      - compile:
          name: compile_10
          previous: step09
          next: step10
          requires:
            - compile_09
