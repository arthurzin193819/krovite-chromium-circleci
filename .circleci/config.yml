version: 2.1

# A compilação completa é opt-in: os eventos de GitHub só rodam validação barata.
parameters:
  build_chromium:
    type: boolean
    default: false

jobs:
  validate:
    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - checkout
      - run:
          name: Validar scripts sem baixar Chromium
          command: |
            set -euo pipefail
            bash -n scripts/01_fetch.sh scripts/02_prepare.sh scripts/03_build.sh
            test -f .circleci/config.yml
            echo 'Validação local dos scripts: OK'

  compile_chromium:
    machine:
      image: ubuntu-2404:current
    resource_class: large
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Chromium Android ARM64 — tentativa real em um único runner
          command: |
            set -euo pipefail
            mkdir -p output
            echo 'Sem cache/workspace de 100+ GB. Limite do plano Free: 1 hora por job.'
            timeout --signal=TERM --kill-after=30s 55m \
              bash -c 'set -euo pipefail; bash scripts/01_fetch.sh; bash scripts/02_prepare.sh; bash scripts/03_build.sh' \
              || { code=$?; echo "Falha ou tempo esgotado (exit $code). Sem APK garantido." >&2; exit "$code"; }
          no_output_timeout: 50m
      - store_artifacts:
          path: output
          destination: chromium-android

workflows:
  safe_validation:
    unless: << pipeline.parameters.build_chromium >>
    jobs:
      - validate:
          filters:
            branches:
              only: main

  manual_chromium_build:
    when: << pipeline.parameters.build_chromium >>
    jobs:
      - compile_chromium:
          filters:
            branches:
              only: main
